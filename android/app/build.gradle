plugins {
    id 'com.android.application'
}

android {
    namespace 'org.featherllm.android'
    compileSdk 36
    ndkVersion '30.0.16248370'

    defaultConfig {
        applicationId 'org.featherllm.android'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'

        externalNativeBuild {
            cmake {
                arguments '-DFEATHERLLM_BUILD_TESTS=OFF'
                cppFlags '-std=c++20'
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.10.2'
        }
    }
}
